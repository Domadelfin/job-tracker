# Local development stack: mirrors the AWS layout
#   browser -> frontend (Next.js, :3000) -> /api/* -> backend (Node, :4000) -> Postgres
# On AWS: ALB replaces the /api rewrite, Fargate runs the same images, RDS replaces "db".

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-jobtracker}
      POSTGRES_USER: ${DB_USER:-jobtracker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports:" on purpose. The backend reaches Postgres over the internal
    # compose network (host "db"), just like RDS will only be reachable inside
    # the VPC. To inspect the DB from your laptop, use:
    #   docker compose exec db psql -U jobtracker -d jobtracker
    # (5432 on this PC is taken by a locally installed PostgreSQL service.)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-jobtracker}
      DB_USER: ${DB_USER:-jobtracker}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:4000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
